name: Update hate crime data

on:
  schedule:
    # Every Saturday at 04:00 UTC (= midnight Eastern, currently EDT/UTC-4).
    # NOTE: GitHub Actions cron is fixed UTC and does not auto-adjust for
    # daylight saving. During EST (UTC-5, roughly Nov-Mar) this will fire
    # at 11pm Eastern Friday night instead of true midnight Saturday -
    # nudge to '0 5 * * 6' during EST months to keep it at exact midnight.
    # Timed to catch Montgomery County's Friday data updates promptly.
    - cron: '0 4 * * 6'
  workflow_dispatch: {}  # allows manual "Run workflow" trigger from the Actions tab

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests scikit-learn numpy

      - name: Fetch DC data
        run: python scripts/fetch_dc.py

      - name: Fetch Montgomery County data
        run: python scripts/fetch_mcpd.py

      - name: Build & clean merged event data
        run: python scripts/build_data.py

      - name: Run analysis (clustering, predictions, risk scores)
        run: python scripts/analyze.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/analytics.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated weekly data update ($(date -u +%Y-%m-%d))"
            # Retry push with a rebase in case another commit landed on main
            # while this run was fetching/analyzing (e.g. a manual code push).
            for i in 1 2 3; do
              if git push; then
                break
              fi
              echo "Push rejected, pulling and rebasing (attempt $i)..."
              git pull --rebase origin main
            done
          fi
